name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR cancels that PR's older run. Runs on main are
# never cancelled: each must finish (and save the Rust build cache that
# every PR restores), or every Rust run starts cold (~18 min, not ~4).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      # The backend's production compile (tsc -p tsconfig.build.json).
      - name: Backend build
        run: pnpm -F @cloudpunch/backend build

      # The web dashboard (ADR-0033), as deploy-pilot.sh builds it.
      - name: Web build
        run: pnpm -F @cloudpunch/web build

  # The web app in a real browser (item 9, 2026-10-14): Playwright,
  # Chromium only, at desktop width and on a phone, against a mocked API.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm -F @cloudpunch/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm -F @cloudpunch/web exec playwright install --with-deps chromium

      - name: Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -F @cloudpunch/web exec playwright install-deps chromium

      - name: Browser tests
        run: pnpm -F @cloudpunch/web test:e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Real Postgres via Testcontainers (Docker is on ubuntu runners). These
  # exercise the SQL the unit tests' in-memory DB can't: triggers,
  # constraints, jsonb round trips.
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend integration tests (Postgres 16)
        run: pnpm -F @cloudpunch/backend test:integration

  # The desktop agent targets Windows (Win32 watchers, Credential
  # Manager), so its Rust is built, linted and tested on Windows.
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds the built frontend (frontendDist).
      - name: Build desktop frontend
        run: pnpm -F @cloudpunch/desktop vite:build

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # ADR-0026: the same Rust crate, built, linted and tested on macOS
  # (Apple Silicon) on every PR, so the Mac app never drifts.
  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds the built frontend (frontendDist).
      - name: Build desktop frontend
        run: pnpm -F @cloudpunch/desktop vite:build

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
