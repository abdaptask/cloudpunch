[package]
name = "cloudpunch-desktop"
version = "0.0.0"
description = "CloudPunch employee time and attendance desktop agent"
authors = ["ApTask"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cloudpunch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ed25519 event signing per ADR-0004 §5. Matches the WebCrypto Ed25519
# used by the backend verifier.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize", "rand_core"] }
thiserror = "1"
# SQLCipher-encrypted local outbox (ADR-0004 §7, ADR-0007 §5). The
# vendored-openssl variant bundles both SQLCipher AND OpenSSL from
# source so we don't need a system OpenSSL install on any platform.
# First build takes ~3-6 minutes; incremental builds are fast.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
hex = "0.4"
# UUID v4 for sync-loop correlation_ids (backend schema requires UUID
# for the batch envelope's correlation_id).
uuid = { version = "1", features = ["v4"] }
# HTTP client for the sync loop -> POST /v1/events.
# `blocking` matches the sync loop's sync thread model.
# `rustls-tls-native-roots` uses rustls + system CA store — avoids
# tangling with SQLCipher's vendored OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
] }

# OS state watchers (idle, session, power, mic/cam, network) per
# ADR-0003. Feature-gated to keep the compile surface small — we add
# features as later watcher slices need them (session/power/registry/
# network land in 2b.5.2 – 2b.5.5).
# OS secure store for the device key, outbox key, and (2b.4 F2) the
# refresh token: Windows Credential Manager / macOS Keychain
# (ADR-0007 §5). 3.x keeps our MSRV (4.x needs Rust 1.88).
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }
# CSPRNG for key generation (already in the tree via uuid).
getrandom = "0.3"
# Key encoding in the secure store (ADR-0007 §5: base64url).
base64 = "0.22"
# Sign-in (ADR-0002 §5, 2b.4 F2): PKCE S256 challenge, login URL /
# callback parsing, and opening the system browser.
sha2 = "0.10"
url = "2"
open = "5.4"
# Native notifications for the tray-residency notice and on-the-clock
# reminders (ADR-0013). Sent from Rust only; no webview permission.
tauri-plugin-notification = "2.3"
# Event timestamps with the local UTC offset, and the IANA zone name
# (ADR-0004 event fields client_ts / utc_offset_minutes / tz_iana).
# Both already in the tree.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # IAudioSessionManager2 capture-session check in
    # watchers/audio_session.rs (ADR-0003 §7).
    "Win32_Media_Audio",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Safe wrappers for the registry walk in `watchers/mic_cam.rs` —
# avoids ~150 lines of Reg*W unsafe FFI in our code for zero
# functional difference.
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
# gethostname(3) for the enrollment hostname hash (2b.4 F3b). Already
# in the tree; Windows uses GetComputerNameExW from `windows`.
libc = "0.2"

[dev-dependencies]
# CSPRNG for keypair generation in unit + conformance tests.
rand = "0.8"
# Temp files for outbox integration tests that need on-disk DBs.
tempfile = "3"
# In-process HTTP mock server for the sync loop's reqwest client
# integration tests. Blocking-friendly (unlike wiremock).
httpmock = "0.7"

[features]
# Tauri's custom-protocol feature is required for the production
# window loader (loads from tauri://localhost instead of the dev URL).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
