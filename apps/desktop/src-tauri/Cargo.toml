[package]
name = "cloudpunch-desktop"
version = "0.0.0"
description = "CloudPunch employee time and attendance desktop agent"
authors = ["apTask"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cloudpunch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ed25519 event signing per ADR-0004 §5. Matches the WebCrypto Ed25519
# used by the backend verifier.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize", "rand_core"] }
thiserror = "1"
# SQLCipher-encrypted local outbox (ADR-0004 §7, ADR-0007 §5). The
# vendored-openssl variant bundles both SQLCipher AND OpenSSL from
# source so we don't need a system OpenSSL install on any platform.
# First build takes ~3-6 minutes; incremental builds are fast.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
hex = "0.4"

# OS state watchers (idle, session, power, mic/cam, network) per
# ADR-0003. Feature-gated to keep the compile surface small — we add
# features as later watcher slices need them (session/power/registry/
# network land in 2b.5.2 – 2b.5.5).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Safe wrappers for the registry walk in `watchers/mic_cam.rs` —
# avoids ~150 lines of Reg*W unsafe FFI in our code for zero
# functional difference.
winreg = "0.52"

[dev-dependencies]
# CSPRNG for keypair generation in unit + conformance tests.
rand = "0.8"
# Temp files for outbox integration tests that need on-disk DBs.
tempfile = "3"

[features]
# Tauri's custom-protocol feature is required for the production
# window loader (loads from tauri://localhost instead of the dev URL).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
