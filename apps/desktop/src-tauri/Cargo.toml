[package]
name = "cloudpunch-desktop"
version = "0.0.0"
description = "CloudPunch employee time and attendance desktop agent"
authors = ["apTask"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cloudpunch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Tauri's custom-protocol feature is required for the production
# window loader (loads from tauri://localhost instead of the dev URL).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
